---

- name: CHS Test Standard Suite
  delegate_to: "{{ 'localhost' if scheduler == 'gke' else inventory_hostname }}"
  vars:
    ansible_async_dir: "/tmp/.ansible_async_user"
    ansible_async_dir_root: "/tmp/.ansible_async_root"
  block:
  - name: Ensure async directories exist
    block:
    - name: Ensure user async directory exists
      ansible.builtin.file:
        path: "{{ ansible_async_dir }}"
        state: directory
        mode: '0700'

    - name: Ensure root async directory exists
      ansible.builtin.file:
        path: "{{ ansible_async_dir_root }}"
        state: directory
        mode: '0700'
      become: true

  - name: Setup environment for CHS
    become: true
    vars:
      ansible_async_dir: "{{ ansible_async_dir_root }}"
    when: scheduler == 'slurm'
    block:
    - name: Set variables for CHS setup
      ansible.builtin.set_fact:
        chs_venv_path: "/opt/chs_venv"

    - name: Create Python Virtual Environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ chs_venv_path }}"
        creates: "{{ chs_venv_path }}/bin/python"
      async: 120
      poll: 10

  - name: Install and Setup CHS
    block:
    - name: Create temporary directory for CHS clone
      ansible.builtin.tempfile:
        state: directory
        suffix: chs_clone
      register: chs_temp_dir
      delegate_to: localhost

    - name: Clone CHS repository
      ansible.builtin.git:
        repo: "{{ chs_repo }}"
        dest: "{{ chs_temp_dir.path }}"
        version: release
        accept_hostkey: true
      async: 120
      poll: 10
      delegate_to: localhost

    - name: Install CHS into venv
      ansible.builtin.pip:
        name: "{{ chs_temp_dir.path }}"
        virtualenv: "{{ chs_venv_path }}"
      async: 300
      poll: 10
      become: true
      when: scheduler == 'slurm'
      vars:
        ansible_async_dir: "{{ ansible_async_dir_root }}"

  - name: Perform CHS Operations (Slurm)
    environment:
      PATH: "{{ chs_venv_path }}/bin:{{ lookup('env', 'PATH') }}"
    when: scheduler == 'slurm'
    block:
    - name: Configure bucket for CHS
      ansible.builtin.shell: |
        set -e -u
        chs configure storage gcs chs-results
      async: 120
      poll: 10
      changed_when: false

    - name: "Run CHS suites"
      ansible.builtin.shell: |
        set -e -u
        chs run --suite {{ item }}
      loop: "{{ chs_suites | default(['standard']) }}"
      register: chs_runs_slurm
      async: 3000
      poll: 10
      changed_when: false

    - name: CHS run output
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ chs_runs_slurm.results }}"
      loop_control:
        label: "{{ item.item }}"

  - name: Perform CHS Operations (GKE)
    delegate_to: localhost
    when: scheduler == 'gke'
    block:
    - name: "Run CHS suites via run_chs_gke.sh"
      args:
        chdir: "{{ chs_temp_dir.path }}"
      ansible.builtin.shell: |
        set -e -u -o pipefail
        
        # Override the suite in values.yaml
        sed -i 's/suite: .*/suite: {{ item }}/' helm/values.yaml
        
        # Configure gcloud defaults just in case
        gcloud config set project {{ project | default(custom_vars.project) }}
        gcloud config set compute/region {{ region }}
        gcloud config set container/cluster {{ deployment_name }}
        
        echo "Running run_chs_gke.sh for suite {{ item }}..."
        # Create inputs file to avoid YAML indentation issues with heredocs
        cat << 'EOF_INPUTS' > inputs.txt
        {{ project | default(custom_vars.project) }}
        {{ deployment_name }}
        {{ region }}
        
        chs-results
        EOF_INPUTS
        
        # Clean up any leading whitespace caused by YAML indentation
        sed -i 's/^[[:space:]]*//' inputs.txt
        
        # Remove the TODO block that attempts cross-project IAM binding which the CI runner lacks permissions for
        sed -i '/TODO:.*to remove from here/,/TODO:.*to remove until here/d' ./bin/run_chs_gke.sh
        
        # The test runner lacks helm. Download it locally and add it to PATH.
        if ! command -v helm &> /dev/null; then
          echo "Helm not found, downloading..."
          curl -fsSL https://get.helm.sh/helm-v3.14.2-linux-amd64.tar.gz | tar -xz
          export PATH="$PWD/linux-amd64:$PATH"
        fi
        
        cat inputs.txt | ./bin/run_chs_gke.sh chs-test-{{ item }}
        
        # Wait for the orchestrator job to be created
        echo "Waiting for CHS Orchestrator Job to be created..."
        
        # Poll for up to 60 seconds for the job to appear
        for i in {1..30}; do
          JOB_NAME=$(kubectl get jobs -n chs-system -o custom-columns=NAME:.metadata.name --no-headers 2>/dev/null | grep '^chs-orchestrator' || true)
          if [[ -n "$JOB_NAME" ]]; then
            break
          fi
          sleep 2
        done
        
        if [[ -z "$JOB_NAME" ]]; then
          echo "Error: CHS Orchestrator Job not found!"
          exit 1
        fi
        
        echo "Found Job: $JOB_NAME. Waiting for it to finish..."
        kubectl wait --for=condition=complete --timeout=30m job/$JOB_NAME -n chs-system || {
          echo "Job timed out or failed!"
          kubectl logs job/$JOB_NAME -n chs-system
          exit 1
        }
        
        echo "Job completed successfully. Logs:"
        kubectl logs job/$JOB_NAME -n chs-system
        
        # Clean up so the next suite can run
        printf "\n" | ./bin/delete_chs_gke.sh
      loop: "{{ chs_suites | default(['standard']) }}"
      register: chs_runs_gke
      async: 3600
      poll: 10
      changed_when: false

    - name: CHS run output
      ansible.builtin.debug:
        msg: "{{ item.stdout }}"
      loop: "{{ chs_runs_gke.results }}"
      loop_control:
        label: "{{ item.item }}"

  rescue:
  - name: CHS Test Failure
    ansible.builtin.debug:
      msg: "CHS tests failed or timed out. Continuing playbook execution."
    ignore_errors: true

  always:
  - name: Cleanup Kubernetes resources
    delegate_to: localhost
    ansible.builtin.shell: |
      kubectl delete jobset --all --ignore-not-found
      kubectl delete job --all --ignore-not-found
      kubectl delete pod --all --ignore-not-found
    async: 300
    poll: 10
    ignore_errors: true
    when: scheduler == 'gke'

  - name: Cleanup Slurm resources
    ansible.builtin.shell: |
      scancel -u $(whoami)
    async: 300
    poll: 10
    when: scheduler == 'slurm'
    ignore_errors: true

  - name: Cleanup temporary directory
    ansible.builtin.file:
      path: "{{ chs_temp_dir.path }}"
      state: absent
    become: true
    ignore_errors: true
    when: chs_temp_dir.path is defined
